# One-click setup on Render. The disk is the important part: the SQLite database
# must survive restarts and deploys, and a free instance has no disk.
services:
  - type: web
    name: our-wellness-portal
    runtime: node
    plan: starter            # a disk requires a paid instance; free wipes the database
    buildCommand: npm ci --include=dev && npm run build  # NODE_ENV=production would skip vite and tsc
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: portal-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"          # node:sqlite is stable from 24
      - key: APP_ORIGIN
        value: https://ournetworkportal.com
      - key: NODE_ENV
        value: production
      - key: ENABLE_SAMPLE_DATA
        value: "false"
      - key: DATABASE_PATH
        value: /data/portal.sqlite
      - key: TRUST_PROXY
        value: "true"
      - key: Google_places_API
        sync: false          # set in the Render dashboard; the value never enters this file
